<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0a0a0f"/>

  <!-- Glow behind gavel -->
  <ellipse cx="100" cy="95" rx="58" ry="58" fill="#7c3aed" opacity="0.12"/>

  <!-- Shadow cast on surface -->
  <ellipse cx="108" cy="155" rx="42" ry="9" fill="#000000" opacity="0.5"/>

  <!-- Gavel handle -->
  <rect x="108" y="108" width="12" height="58" rx="5" fill="#a78bfa" transform="rotate(-38 108 108)"/>

  <!-- Gavel head -->
  <rect x="52" y="62" width="80" height="34" rx="8" fill="#7c3aed"/>

  <!-- Gavel head band -->
  <rect x="87" y="62" width="14" height="34" fill="#4c1d95"/>

  <!-- Strike lines -->
  <line x1="136" y1="57" x2="148" y2="45" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="144" y1="68" x2="158" y2="62" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="138" y1="79" x2="152" y2="79" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Lock body embedded in gavel head -->
  <rect x="58" y="70" width="20" height="16" rx="3" fill="#1e0a4a"/>
  <path d="M63 70 Q63 63 68 63 Q73 63 73 70" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="68" cy="77" r="2.2" fill="#a78bfa"/>
  <line x1="68" y1="78.5" x2="68" y2="82" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

</svg>